<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="384" viewBox="0 0 880 384" role="img">
  <title>shrpOS boot sequence</title>
  <desc>shrpOS BIOS v1.0 boots: power on, POST, kernel, user profile, GitHub connection and project registry all report OK, then SYSTEM READY and WELCOME, MARCELO.</desc>
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#00ff41" stroke-opacity="0.05"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" fill-opacity="0.22"/>
    </pattern>
    <clipPath id="panel">
      <rect x="0.5" y="0.5" width="879" height="383" rx="8"/>
    </clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes type {
      from { clip-path: inset(-12% 100% -12% 0); }
      to   { clip-path: inset(-12% 0 -12% 0); }
    }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .type { transform-box: fill-box; animation-name: type; animation-duration: .4s; animation-timing-function: steps(40, end); animation-fill-mode: both; }
    .bios{animation:type .5s steps(22,end) .1s both}
    .l1{animation-delay:0.45s}
    .l2{animation-delay:0.87s}
    .l3{animation-delay:1.29s}
    .l4{animation-delay:1.71s}
    .l5{animation-delay:2.13s}
    .l6{animation-delay:2.55s}
    .ready{animation:type .45s steps(12,end) 3.1s both}
    .welcome{animation:type .8s steps(17,end) 3.55s both}
    .cursor { animation: blink 1.06s step-end 3.55s infinite; }
    @media (prefers-reduced-motion: reduce) {
      .type, .cursor, .pulse { animation: none !important; }
      .type { clip-path: none; }
      .cursor { opacity: 1; transform: none; }
    }
  </style>
  <rect width="880" height="384" fill="#050805"/>
  <rect width="880" height="384" fill="url(#grid)"/>
  <rect width="880" height="384" fill="url(#scan)"/>
  <g clip-path="url(#panel)">
  <rect x="0" y="0" width="880" height="38" fill="#0c2e1a"/>
  <line x1="0" y1="38" x2="880" y2="38" stroke="#1f8f3f" stroke-opacity="0.6"/>
  <text x="24" y="25" font-family="'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#00ff41" letter-spacing="1.2">shrpOS BIOS v1.0</text>
  <text x="856" y="25" text-anchor="end" font-family="'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#1f8f3f" letter-spacing="1.2">POST</text>
  </g>
  <rect x="0.5" y="0.5" width="879" height="383" rx="8" fill="none" stroke="#1f8f3f" stroke-opacity="0.55"/>
  <text x="30" y="74" class="type bios" font-family="'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#1f8f3f" letter-spacing="1">shrpOS BIOS v1.0  ::  cold boot</text>
  <text x="30" y="112" class="type l1" font-family="'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="15" fill="#8bf0a4">&gt; Power on ........................... OK</text>
  <text x="30" y="140" class="type l2" font-family="'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="15" fill="#8bf0a4">&gt; POST ............................... OK</text>
  <text x="30" y="168" class="type l3" font-family="'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="15" fill="#8bf0a4">&gt; Initializing kernel ................ OK</text>
  <text x="30" y="196" class="type l4" font-family="'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="15" fill="#8bf0a4">&gt; Loading user profile ............... OK</text>
  <text x="30" y="224" class="type l5" font-family="'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="15" fill="#8bf0a4">&gt; Connecting to GitHub ............... OK</text>
  <text x="30" y="252" class="type l6" font-family="'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="15" fill="#8bf0a4">&gt; Loading project registry ........... OK</text>
  <text x="30" y="304" class="type ready" font-family="'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="15" font-weight="bold" fill="#00ff41" filter="url(#glow)">SYSTEM READY</text>
  <rect class="cursor" x="150" y="290" width="9" height="17" fill="#00ff41"/>
  <text x="30" y="344" class="type welcome" font-family="'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="22" font-weight="bold" fill="#aaffc0" letter-spacing="2" filter="url(#glow)">WELCOME, MARCELO.</text>
</svg>
