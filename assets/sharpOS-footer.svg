<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="72" viewBox="0 0 880 72" role="img">
  <title>sharpOS status bar</title>
  <desc>sharpOS system status: session active, memory OK, network OK, end of file.</desc>
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#00ff41" stroke-opacity="0.05"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" fill-opacity="0.22"/>
    </pattern>
    <clipPath id="panel">
      <rect x="0.5" y="0.5" width="879" height="71" rx="8"/>
    </clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { animation: blink 1.06s step-end infinite; }
    @media (prefers-reduced-motion: reduce) {
      .type, .cursor, .pulse { animation: none !important; }
      .cursor { opacity: 1; }
    }
  </style>
  <rect width="880" height="72" fill="#050805"/>
  <rect width="880" height="72" fill="url(#grid)"/>
  <rect width="880" height="72" fill="url(#scan)"/>
  <g clip-path="url(#panel)">

  </g>
  <rect x="0.5" y="0.5" width="879" height="71" rx="8" fill="none" stroke="#1f8f3f" stroke-opacity="0.55"/>
  <text x="28" y="44" font-family="'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#00ff41" letter-spacing="1">sharpOS v1.0</text>
  <text x="440" y="44" text-anchor="middle" font-family="'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#1f8f3f" letter-spacing="1">SESSION ACTIVE  ::  MEM OK  ::  NET OK</text>
  <text x="838" y="44" text-anchor="end" font-family="'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#8bf0a4" letter-spacing="1">EOF</text>
  <rect class="cursor" x="844" y="32" width="8" height="15" fill="#00ff41"/>
</svg>
