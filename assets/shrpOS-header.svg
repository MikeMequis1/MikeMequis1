<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="214" viewBox="0 0 880 214" role="img">
  <title>shrpOS :: Personal Development Terminal</title>
  <desc>Terminal header: user Marcelo, node github.com/MikeMequis1, shell /bin/shrp, build stable, status on-line.</desc>
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#00ff41" stroke-opacity="0.05"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" fill-opacity="0.22"/>
    </pattern>
    <clipPath id="panel">
      <rect x="0.5" y="0.5" width="879" height="213" rx="8"/>
    </clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    .cursor { animation: blink 1.06s step-end infinite; }
    @media (prefers-reduced-motion: reduce) {
      .type, .cursor, .pulse { animation: none !important; }
      .type { clip-path: none; }
      .cursor { opacity: 1; transform: none; }
    }
  </style>
  <rect width="880" height="214" fill="#050805"/>
  <rect width="880" height="214" fill="url(#grid)"/>
  <rect width="880" height="214" fill="url(#scan)"/>
  <g clip-path="url(#panel)">
  <rect x="0" y="0" width="880" height="38" fill="#0c2e1a"/>
  <line x1="0" y1="38" x2="880" y2="38" stroke="#1f8f3f" stroke-opacity="0.6"/>
  <text x="24" y="25" font-family="'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#00ff41" letter-spacing="1.2">shrpOS :: PERSONAL DEVELOPMENT TERMINAL</text>
  <text x="856" y="25" text-anchor="end" font-family="'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#1f8f3f" letter-spacing="1.2">v1.1</text>
  </g>
  <rect x="0.5" y="0.5" width="879" height="213" rx="8" fill="none" stroke="#1f8f3f" stroke-opacity="0.55"/>
  <text x="28" y="82" font-family="'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="15" fill="#aaffc0">USER: MARCELO</text>
  <text x="852" y="82" text-anchor="end" font-family="'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="15" fill="#00ff41">STATUS: ONLINE</text>
  <circle class="pulse" cx="714" cy="77" r="5" fill="#00ff41"/>
  <text x="28" y="116" font-family="'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="15" fill="#8bf0a4">NODE: github.com/MikeMequis1</text>
  <text x="852" y="116" text-anchor="end" font-family="'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="15" fill="#8bf0a4">SHELL: /bin/shrp</text>
  <text x="28" y="150" font-family="'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="15" fill="#8bf0a4">ROLE: SOFTWARE DEVELOPER</text>
  <text x="852" y="150" text-anchor="end" font-family="'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="15" fill="#8bf0a4">BUILD: STABLE</text>
  <text x="28" y="188" font-family="'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="15" fill="#1f8f3f">&gt; awaiting input</text>
  <rect class="cursor" x="182" y="174" width="9" height="17" fill="#00ff41"/>
</svg>
